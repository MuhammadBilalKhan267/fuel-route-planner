[project]
name = "fuel-route-assessment"
version = "0.1.0"
description = "A Django API for fixed-route fuel purchase planning"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django==6.1.2",
    "httpx==0.28.1",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "python-dotenv>=1.1,<2",
]

[tool.uv]
package = false

[dependency-groups]
data = [
    "osmium>=4,<5",
    "pillow>=11,<13",
    "pyshp>=3,<4",
]
dev = ["coverage>=7.10,<8", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 100
extend-exclude = ["trips/migrations", ".uv-cache", "data/coordinate-sources"]
